name: frontend-visual-regression

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-visual-regression.yml'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Generate updated visual snapshots instead of comparing existing baselines'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  visual-baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Check visual baseline availability
        id: visual-baselines
        shell: bash
        run: |
          if compgen -G "e2e/visual-baseline.spec.ts-snapshots/*-chromium-linux.png" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual regression checks
        if: (github.event_name != 'workflow_dispatch' || inputs.update_snapshots == 'false') && steps.visual-baselines.outputs.available == 'true'
        run: npm run test:visual

      - name: Generate initial visual snapshots
        if: (github.event_name != 'workflow_dispatch' || inputs.update_snapshots == 'false') && steps.visual-baselines.outputs.available == 'false'
        run: npm run test:visual:update

      - name: Generate updated visual snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots == 'true'
        run: npm run test:visual:update

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: frontend/e2e/visual-baseline.spec.ts-snapshots
          retention-days: 7

      - name: Upload failed test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
