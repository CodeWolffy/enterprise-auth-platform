<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权确认</title>
  <style>
    :root{
      --brand:{{brandColor}};
      --brand-soft:{{brandSoftColor}};
      --text:#1f2937;
      --muted:#667085;
      --line:rgba(15,23,42,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left,var(--brand-soft),transparent 30%),
        linear-gradient(135deg,#f5f8ff 0%,#f8f1e8 100%);
      display:grid;
      place-items:center;
      padding:24px;
    }
    .panel{
      width:min(860px,100%);
      display:grid;
      gap:20px;
      padding:34px;
      border-radius:28px;
      background:rgba(255,255,255,.92);
      border:1px solid var(--line);
      box-shadow:0 32px 96px rgba(15,23,42,.14);
    }
    .eyebrow{
      display:inline-flex;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--brand);
      font-size:12px;
      font-weight:700;
    }
    h1{margin:0;font-size:32px}
    .summary{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }
    .summary-card,.scope-card{
      padding:18px;
      border-radius:20px;
      border:1px solid var(--line);
      background:rgba(248,250,252,.85);
    }
    .summary-card strong,.scope-card strong{display:block;margin-bottom:8px}
    .scope-grid{display:grid;gap:14px}
    .scope-card p,.summary-card p{margin:0;color:var(--muted);line-height:1.7}
    .scope-card label{display:flex;align-items:flex-start;gap:12px}
    .actions{display:flex;gap:14px}
    button{
      flex:1;
      border:none;
      border-radius:16px;
      padding:14px 18px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }
    .approve{background:var(--brand);color:#fff}
    .deny{background:#eef2f6;color:#1f2937}
    @media (max-width: 820px){
      .summary{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="panel">
    <div>
      <span class="eyebrow">授权确认</span>
      <h1>确认客户端访问权限</h1>
      <p style="color:var(--muted);line-height:1.8;">
        客户端 <strong>{{clientName}}</strong> 正在申请访问 <strong>{{tenantName}}</strong> 租户的数据与接口，请确认要授予的作用域。
      </p>
    </div>

    <div class="summary">
      <div class="summary-card">
        <strong>租户上下文</strong>
        <p>{{tenantLevel}}</p>
      </div>
      <div class="summary-card">
        <strong>客户端编号</strong>
        <p>{{clientId}}</p>
      </div>
      <div class="summary-card">
        <strong>授权方式</strong>
        <p>{{clientMode}}</p>
      </div>
    </div>

    <form method="post" action="/oauth2/authorize">
      {{csrfHiddenInput}}
      <input type="hidden" name="client_id" value="{{clientIdRaw}}" />
      <input type="hidden" name="state" value="{{state}}" />
      <input type="hidden" name="tenantId" value="{{tenantId}}" />
      <div class="scope-grid">{{scopeHtml}}</div>
      <div class="actions" style="margin-top:18px;">
        <button class="approve" type="submit">确认授权</button>
        <button class="deny" type="submit" name="consent_action" value="deny">拒绝</button>
      </div>
    </form>
  </div>
</body>
</html>
