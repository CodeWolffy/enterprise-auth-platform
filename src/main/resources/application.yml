server:
  port: 8080

spring:
  application:
    name: enterprise-auth-platform

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/enterprise_auth_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: EnterpriseAuthHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: 139.196.7.151
      port: 6379
      password: zhu123456@
      database: 8
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  boot:
    admin:
      client:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true

app:
  frontend:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173

  security:
    session-ttl: 7d
    captcha-ttl: 5m
    expose-captcha-answer: false
    cookie-secure: false
    cookie-same-site: Lax
    redis:
      session-enabled: true
      captcha-enabled: true
      redisson-enabled: true
      key-prefix: "eap:auth:"
      namespace-version: "v2"

  tenant:
    header-name: X-Tenant-Id
    platform-tenant-id: platform
    mybatis-tenant-enabled: true
    mybatis-ignore-tables:
      - sys_tenant

  registration:
    # 注册接口防刷策略。
    rate-limit-enabled: true
    max-attempts-per-user-ip: 10
    max-attempts-per-ip: 40
    attempt-window: 10m

  rate-limit:
    # 通用接口限流，依赖 Redis 存储令牌桶。
    enabled: true
    default-capacity: 20
    default-refill-tokens: 20
    default-refill-duration: 1m
    failure-mode: open
    trusted-proxies:
      - 127.0.0.1/32
      - ::1/128
    rules:
      login:
        capacity: 5
        refill-tokens: 5
        refill-duration: 60s
        failure-mode: closed
      captcha:
        capacity: 10
        refill-tokens: 10
        refill-duration: 60s
        failure-mode: closed
      export:
        capacity: 5
        refill-tokens: 5
        refill-duration: 60s

  cache:
    key-prefix: "eap:cache:"
    namespace-version: "v4"
    default-ttl: 10m
    auth-principal-ttl: 15m
    registration-policy-ttl: 5m
    system-dicts-ttl: 30m
    system-configs-ttl: 30m
    system-categories-all-ttl: 60m
    system-categories-target-ttl: 60m

  features:
    gateway-enabled: false
    nacos-enabled: false
    mq-enabled: false
    seata-enabled: false
    job-enabled: false
    loki-enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"
