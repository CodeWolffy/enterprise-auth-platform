server:
  port: 8080

spring:
  application:
    name: enterprise-auth-platform
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/enterprise_auth_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  boot:
    admin:
      client:
        enabled: false
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true

app:
  authorization-server:
    issuer: http://127.0.0.1:8080
    jwk-file: data/oauth2-jwk.json
  frontend:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
    public-client-id: eap-frontend-spa
    public-client-secret: FrontendClientSecret@123
    public-client-name: Frontend Console
    redirect-uris:
      - http://127.0.0.1:5173/auth/callback
      - http://localhost:5173/auth/callback
    scopes:
      - openid
      - profile
      - api.read
      - api.write
  security:
    jwt-secret: "LOCAL_CHANGE_ME_7B3f1D5k9Q2m6R8t0W4xY7zA1cE5gH9J"
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    captcha-ttl: 5m
    expose-captcha-answer: false
    cookie-secure: false
    cookie-same-site: Lax
    redis:
      session-enabled: true
      captcha-enabled: true
      redisson-enabled: true
      key-prefix: "eap:auth:"
      namespace-version: "v2"
  tenant:
    header-name: X-Tenant-Id
    platform-tenant-id: platform
    mybatis-tenant-enabled: true
    mybatis-ignore-tables:
      - oauth2_authorization
      - oauth2_authorization_consent
      - sys_tenant
  persistence:
    database-enabled: true
  cache:
    key-prefix: "eap:cache:"
    namespace-version: "v4"
    default-ttl: 10m
    auth-principal-ttl: 15m
    system-dicts-ttl: 30m
    system-configs-ttl: 30m
    system-categories-all-ttl: 60m
    system-categories-target-ttl: 60m
  features:
    gateway-enabled: false
    nacos-enabled: false
    mq-enabled: false
    seata-enabled: false
    job-enabled: false
    loki-enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"
