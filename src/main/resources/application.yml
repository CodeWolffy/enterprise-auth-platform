server:
  port: 8080

spring:
  application:
    name: enterprise-auth-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: EnterpriseAuthHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: ${PLATFORM_FILE_MAX_SIZE:10MB}
      max-request-size: ${PLATFORM_FILE_MAX_SIZE:10MB}

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

  boot:
    admin:
      client:
        enabled: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 172800
  active-timeout: ${APP_SECURITY_SESSION_IDLE_SECONDS:7200}
  auto-renew: true
  dynamic-active-timeout: true
  is-concurrent: true
  is-share: false
  max-login-count: ${APP_SECURITY_MAX_LOGIN_COUNT:10}
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: true
    mail:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: ${KNIFE4J_ENABLED:false}

platform:
  file:
    storage: ${PLATFORM_FILE_STORAGE:minio}
    max-size: ${PLATFORM_FILE_MAX_SIZE:10MB}
    allowed-types:
      - image/png
      - image/jpeg
      - application/pdf
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:}
    region: ${MINIO_REGION:us-east-1}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:false}
    allow-default-credentials: ${MINIO_ALLOW_DEFAULT_CREDENTIALS:false}
    presigned-url-ttl: ${MINIO_PRESIGNED_URL_TTL:10m}

captcha:
  prefix: eap:captcha
  expire:
    default: 120000
  init-default-resource: true
  local-cache-enabled: false
  local-cache-size: 20
  secondary:
    enabled: true
    expire: 300000
    keyPrefix: "eap:captcha:secondary"

app:
  mail:
    secret-key: ${APP_MAIL_SECRET_KEY:}
    connection-timeout-millis: ${APP_MAIL_CONNECTION_TIMEOUT_MILLIS:10000}
    timeout-millis: ${APP_MAIL_TIMEOUT_MILLIS:10000}
    write-timeout-millis: ${APP_MAIL_WRITE_TIMEOUT_MILLIS:10000}
    debug: ${APP_MAIL_DEBUG:false}

  cors:
    allowed-origins: []

  security:
    session-ttl: 7d
    captcha-ttl: 1m
    password-reset:
      token-ttl: 10m
      frontend-url: ${APP_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
      username-window-minutes: ${APP_PASSWORD_RESET_USERNAME_WINDOW_MINUTES:15}
      username-max-requests: ${APP_PASSWORD_RESET_USERNAME_MAX_REQUESTS:3}
      ip-window-minutes: ${APP_PASSWORD_RESET_IP_WINDOW_MINUTES:15}
      ip-max-requests: ${APP_PASSWORD_RESET_IP_MAX_REQUESTS:10}
    notification:
      channel: ${APP_NOTIFICATION_CHANNEL:log}
      mail-from: ${APP_NOTIFICATION_MAIL_FROM:noreply@enterprise-auth-platform.local}
    cookie-secure: false
    cookie-same-site: Lax
    redis:
      session-enabled: true
      captcha-enabled: true
      redisson-enabled: true
      key-prefix: "eap:auth:"
      namespace-version: "v2"

  tenant:
    header-name: X-Tenant-Id
    platform-tenant-id: platform
    mybatis-tenant-enabled: true
    mybatis-ignore-tables:
      - sys_menu
      - sys_tenant
      - sys_platform_security_policy

  registration:
    # 注册接口防刷策略。
    rate-limit-enabled: true
    max-attempts-per-user-ip: 10
    max-attempts-per-ip: 40
    attempt-window: 10m

  rate-limit:
    # 通用接口限流，依赖 Redis 存储令牌桶。
    enabled: true
    default-capacity: 20
    default-refill-tokens: 20
    default-refill-duration: 1m
    failure-mode: closed
    trusted-proxies:
      - 127.0.0.1/32
      - ::1/128
    rules:
      login:
        capacity: 5
        refill-tokens: 5
        refill-duration: 60s
        failure-mode: closed
      captcha:
        capacity: 10
        refill-tokens: 10
        refill-duration: 60s
        failure-mode: closed
      password-reset-request:
        capacity: 5
        refill-tokens: 5
        refill-duration: 60s
        failure-mode: closed
      password-reset-confirm:
        capacity: 5
        refill-tokens: 5
        refill-duration: 60s
        failure-mode: closed
      register:
        capacity: 3
        refill-tokens: 3
        refill-duration: 60s
        failure-mode: closed
      export:
        capacity: 5
        refill-tokens: 5
        refill-duration: 60s

  cache:
    key-prefix: "eap:cache:"
    namespace-version: "v6"
    default-ttl: 10m
    auth-principal-ttl: 15m
    registration-policy-ttl: 5m
    system-dicts-ttl: 30m
    system-configs-ttl: 30m
    system-notices-ttl: 10m
    system-categories-all-ttl: 60m
    system-categories-target-ttl: 60m

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger - %msg%n"
