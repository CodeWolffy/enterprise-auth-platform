spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/enterprise_auth_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: <your-local-db-password>

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      database: 0

app:
  cors:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173

  security:
    cookie-secure: false
    redis:
      redisson-enabled: true