spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/enterprise_auth_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: <your-local-db-password>

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      database: 0

app:
  outbox:
    # 至少 32 个字符；生产环境应由 secret manager 注入 APP_OUTBOX_PAYLOAD_SECRET_KEY。
    payload-secret-key: <your-local-outbox-payload-secret-key-at-least-32-characters>
  cors:
    allowed-origins:
      - http://127.0.0.1:5777
      - http://localhost:5777

  security:
    cookie-secure: false
    redis:
      redisson-enabled: true
