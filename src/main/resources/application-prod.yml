spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ${DB_POOL_NAME:EnterpriseAuthHikariCP}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

app:
  cors:
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGIN}

  security:
    session-ttl: ${APP_SECURITY_SESSION_TTL:7d}
    cookie-secure: true
    cookie-same-site: ${APP_SECURITY_COOKIE_SAME_SITE:Lax}
    notification:
      # staging/prod 禁止 log 通道；缺邮件渠道时 PasswordResetNotificationService fail-closed
      channel: ${APP_NOTIFICATION_CHANNEL:smtp}
      mail-from: ${APP_NOTIFICATION_MAIL_FROM:noreply@enterprise-auth-platform.local}

sa-token:
  active-timeout: ${APP_SECURITY_SESSION_IDLE_SECONDS:7200}
  auto-renew: true
  dynamic-active-timeout: true
  max-login-count: ${APP_SECURITY_MAX_LOGIN_COUNT:10}

knife4j:
  enable: ${PROD_KNIFE4J_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
