spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # 生产环境数据库账号、密码与连接池参数走环境变量。
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ${DB_POOL_NAME:EnterpriseAuthHikariCP}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}

app:
  frontend:
    # 生产环境前端来源与 OAuth 回调地址必须和正式域名一致。
    allowed-origins:
      - ${APP_FRONTEND_ALLOWED_ORIGIN}
    redirect-uris:
      - ${APP_FRONTEND_REDIRECT_URI}
    public-client-secret: ${APP_FRONTEND_CLIENT_SECRET}

  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    expose-captcha-answer: false
    cookie-secure: true
    cookie-same-site: ${APP_SECURITY_COOKIE_SAME_SITE:Lax}