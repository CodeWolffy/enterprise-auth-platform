spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/enterprise_auth_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  data:
    redis:
      host: ${TEST_REDIS_HOST:139.196.7.151}
      port: ${TEST_REDIS_PORT:6379}
      password: ${TEST_REDIS_PASSWORD:zhu123456@}
      database: ${TEST_REDIS_DATABASE:8}
  cache:
    type: simple
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: false

app:
  cors:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
      - http://*:5173
  security:
    session-ttl: 7d
    captcha-ttl: 1m
    cookie-secure: false
    cookie-same-site: Lax
    redis:
      session-enabled: true
      captcha-enabled: true
      redisson-enabled: true
      key-prefix: "eap:auth:"
      namespace-version: "v2"
  tenant:
    header-name: X-Tenant-Id
    platform-tenant-id: platform
    mybatis-tenant-enabled: true
    mybatis-ignore-tables:
      - sys_tenant
  registration:
    rate-limit-enabled: true
    max-attempts-per-user-ip: 10
    max-attempts-per-ip: 40
    attempt-window: 10m
  rate-limit:
    enabled: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 7200
  auto-renew: true
  dynamic-active-timeout: true
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  max-login-count: 10