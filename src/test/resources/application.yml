spring:
  datasource:
    # 禁止默认连公网；本地/CI 须显式注入 TEST_DB_*，或使用 Testcontainers 覆盖
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/enterprise_auth_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
  data:
    redis:
      # 默认仅本机，无密码；禁止提交公网地址与明文凭据
      host: ${TEST_REDIS_HOST:127.0.0.1}
      port: ${TEST_REDIS_PORT:6379}
      password: ${TEST_REDIS_PASSWORD:}
      database: ${TEST_REDIS_DATABASE:8}
  cache:
    type: simple
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: false

app:
  cors:
    allowed-origins:
      - http://127.0.0.1:5777
      - http://localhost:5777
      - http://*:5777
  security:
    session-ttl: 7d
    captcha-ttl: 1m
    cookie-secure: false
    cookie-same-site: Lax
    notification:
      channel: log
    redis:
      session-enabled: true
      captcha-enabled: true
      redisson-enabled: true
      key-prefix: "eap:auth:"
      namespace-version: "v2"
      session-touch-throttle: 30s
  tenant:
    header-name: X-Tenant-Id
    platform-tenant-id: platform
    mybatis-tenant-enabled: true
    mybatis-ignore-tables:
      - sys_tenant
      - sys_outbox_event
  registration:
    rate-limit-enabled: true
    max-attempts-per-user-ip: 10
    max-attempts-per-ip: 40
    attempt-window: 10m
  rate-limit:
    enabled: false

platform:
  file:
    storage: local
    local-root: target/test-files

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 7200
  auto-renew: true
  dynamic-active-timeout: true
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  max-login-count: 10